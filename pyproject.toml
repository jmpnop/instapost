[project]
name = "instapost"
version = "0.1.0"
description = "Tool for posting images to Instagram using Facebook Graph API and Dropbox"
requires-python = ">=3.13"
dependencies = [
    "dropbox",
    "requests",
    "python-dotenv",
    "click",
    "pydantic",
    "matplotlib>=3.10.5",
    "watchdog>=6.0.0",
    "pytz>=2025.2",
    "iptcinfo3>=2.1.4",
    "psutil",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort",
    "mypy",
]

[project.scripts]
instapost = "instapost.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["instapost"]
