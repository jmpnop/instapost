[project]
name = "instapost"
version = "0.2.0"
description = "Instagram automation via remote VM with cron-based scheduling"
requires-python = ">=3.13"
dependencies = [
    "requests",
    "python-dotenv",
    "click",
    "pydantic",
    "pytz>=2025.2",
    "iptcinfo3>=2.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["instapost"]

[project.scripts]
instapost = "instapost.cli:main"
